<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#14171A">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Serial Check</title>
<style>
:root {
  --ink: #14171A;
  --paper: #F2F3EF;
  --line: #C4C8BF;
  --mute: #566058;
  --scan: #0A4FD6;
  --go: #14803C;
  --stop: #C0262D;
  --bg: var(--paper);
  --fg: var(--ink);
  --seg-off: var(--line);
  --seg-now: var(--ink);
  --seg-done: var(--go);
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Roboto Mono", "Droid Sans Mono", Consolas, monospace;
}
body.theme-ok  { --bg: var(--go);   --fg: #fff; --seg-off: rgba(255,255,255,.35); --seg-now: #fff; --seg-done: #fff; }
body.theme-bad { --bg: var(--stop); --fg: #fff; --seg-off: rgba(255,255,255,.35); --seg-now: #fff; --seg-done: #fff; }

[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 18px;
  line-height: 1.35;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
#app {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: max(14px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
  max-width: 560px;
  margin: 0 auto;
}

/* header + round tracker */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 34px; }
.brand { font-weight: 800; font-size: 19px; letter-spacing: -0.01em; }
.link {
  background: none; border: 0; color: inherit; font: inherit; font-size: 16px; font-weight: 600;
  text-decoration: underline; text-underline-offset: 3px; padding: 8px 0 8px 12px; cursor: pointer;
}
.tracker { display: flex; align-items: center; gap: 6px; margin: 8px 0 0; }
.seg { flex: 1; height: 14px; border-radius: 3px; background: var(--seg-off); }
.seg.done { background: var(--seg-done); }
.seg.now  { background: var(--seg-now); }
.roundlabel { font-size: 15px; font-weight: 700; margin: 8px 0 0; min-height: 20px; }

/* content */
main { flex: 1; display: flex; flex-direction: column; padding-top: 18px; min-height: 0; }
h1, h2 { margin: 0 0 10px; letter-spacing: -0.02em; line-height: 1.08; }
h1 { font-size: 40px; font-weight: 800; }
h2 { font-size: 34px; font-weight: 800; }
p { margin: 0 0 12px; }
.sub { color: var(--mute); font-size: 18px; }
body.theme-ok .sub, body.theme-bad .sub { color: rgba(255,255,255,.88); }

.serial {
  font-family: var(--mono);
  font-weight: 700;
  font-size: clamp(26px, 9vw, 44px);
  letter-spacing: 0.02em;
  word-break: break-all;
  line-height: 1.1;
}
.pair { display: grid; gap: 14px; margin: 14px 0 8px; }
.pair .label { font-size: 15px; font-weight: 600; opacity: .88; margin-bottom: 2px; }
.chip {
  border: 2px solid var(--line);
  border-radius: 10px;
  padding: 10px 14px;
  margin: 4px 0 14px;
}
.chip .label { font-size: 15px; color: var(--mute); font-weight: 600; }
.chip .serial { font-size: clamp(22px, 7vw, 32px); }

.actions { margin-top: auto; padding-top: 18px; display: grid; gap: 10px; }
.btn {
  appearance: none; border: 0; border-radius: 12px;
  min-height: 64px; width: 100%;
  font: inherit; font-size: 21px; font-weight: 700;
  background: var(--scan); color: #fff; cursor: pointer;
}
.btn:active { transform: translateY(1px); }
.btn.alt { background: transparent; color: inherit; border: 2px solid currentColor; min-height: 56px; font-size: 18px; }
.btn.light { background: #fff; color: var(--ink); }
:is(.btn, .link, .choice, .wedge-field):focus-visible { outline: 4px solid #FFC300; outline-offset: 3px; }

/* start screen scanner choice */
.choices { display: grid; gap: 10px; margin: 18px 0 8px; }
.choice {
  display: block; width: 100%; text-align: left; cursor: pointer;
  background: #fff; color: var(--ink); font: inherit;
  border: 2px solid var(--line); border-radius: 12px; padding: 14px 16px;
}
.choice b { display: block; font-size: 20px; }
.choice span { color: var(--mute); font-size: 16px; }
.choice[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }

/* photo + camera */
.preview { width: 100%; max-height: 46dvh; object-fit: contain; border-radius: 12px; background: #000; margin: 6px 0 4px; }
.cam {
  position: relative; border-radius: 14px; overflow: hidden; background: #000;
  height: min(46dvh, 420px); margin: 6px 0 10px;
}
.cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
.cam::after {
  content: ""; position: absolute; left: 10%; right: 10%; top: 34%; height: 32%;
  border: 3px solid #fff; border-radius: 10px; box-shadow: 0 0 0 9999px rgba(0,0,0,.38);
}
.status { min-height: 26px; font-weight: 600; }
.status.warn { color: var(--stop); }

.trigger-note {
  border-left: 8px solid var(--ink); padding: 6px 0 6px 16px; margin: 10px 0 14px;
  font-size: 26px; font-weight: 700; line-height: 1.15;
}

/* checking */
.bar { height: 16px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 14px 0; }
.bar > i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .25s linear; }

/* final */
.rounds { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
.rounds li:only-child { border-top: 0; padding-top: 0; }
.rounds li { display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
  border-top: 1px solid rgba(255,255,255,.45); padding-top: 8px; }
.rounds .serial { font-size: clamp(20px, 6vw, 28px); }
.fail { border-top: 1px solid rgba(255,255,255,.55); padding: 12px 0 6px; }
.fail h3 { margin: 0 0 4px; font-size: 20px; }
.fail .label { font-size: 15px; opacity: .9; margin-top: 6px; }
.fail .serial { font-size: clamp(18px, 5.6vw, 26px); }
.fail img { width: 100%; max-height: 180px; object-fit: contain; border-radius: 8px; background: rgba(0,0,0,.35); margin-top: 8px; }
.fail .retake { margin-top: 10px; min-height: 52px; font-size: 18px; }
.err { background: #fff; color: var(--ink); border-radius: 10px; padding: 12px 14px; margin: 12px 0; }

@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } .btn:active { transform: none; } }

/* field that receives the handheld scanner's keystrokes (shown, so focus is reliable and scans are visible) */
.wedge-field {
  width: 100%; font: 700 26px var(--mono); padding: 14px 16px; margin: 4px 0 8px;
  background: #fff; color: var(--ink); border: 3px dashed var(--ink); border-radius: 10px; caret-color: transparent;
}
.wedge-field:focus { border-style: solid; }
.sub.small { font-size: 15px; margin-bottom: 6px; }
.dock { margin-top: 12px; padding-top: 10px; border-top: 3px solid var(--ink); }
.dock-label { display: block; font-size: 15px; font-weight: 600; margin-bottom: 2px; }
.dbg { margin: 2px 0 10px; font-size: 15px; }
.dbg summary { cursor: pointer; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; padding: 6px 0; }
.scanlog { font: 13px/1.3 var(--mono); background: #fff; color: var(--ink); border: 2px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 6px 0 0; white-space: pre-wrap; word-break: break-all; min-height: 3.2em; }
</style>
</head>
<body>
<div id="app">
  <div class="top"><div class="brand">Serial Check</div><div id="topAction"></div></div>
  <div class="tracker" id="tracker" aria-hidden="true"></div>
  <div class="roundlabel" id="roundLabel"></div>
  <main id="screen"></main>
  <div id="dock" class="dock" hidden>
    <label class="dock-label" for="wedge">Scanner box. Tap it once if the keyboard isn't showing, then pull the trigger.</label>
    <input id="wedge" class="wedge-field" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="Scan appears here">
    <div id="sig" class="sub small">Scanner signals received: 0</div>
    <details class="dbg"><summary>Scanner details (for troubleshooting)</summary><pre id="scanlog" class="scanlog">Nothing received yet.</pre></details>
  </div>
</div>
<input id="photoInput" type="file" accept="image/*" capture="environment" hidden>

<script>
(() => {
'use strict';

const ROUNDS = 1;   // serials checked per box. Change this number to check more (e.g. 5).
const ONE = ROUNDS === 1;
const $ = (s) => document.querySelector(s);

/* ---------- helpers ---------- */
function h(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(k));
  return n;
}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
// Serials never contain O or I, so read O as 0 and I as 1. Ignore case, spaces, dashes.
const norm = (s) => String(s || '').toUpperCase().replace(/[\s\-_.]/g, '').replace(/O/g, '0').replace(/I/g, '1');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src));
    document.head.append(s);
  });
}
const abs = (p) => new URL(p, location.href).href;

/* ---------- feedback: sound, vibration, screen awake ---------- */
let actx = null;
function unlockAudio() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch {}
}
function tone(freq, ms, delay = 0, type = 'sine', vol = 0.25) {
  if (!actx) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + ms / 1000);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t + ms / 1000 + 0.02);
}
function vibrate(p) { try { navigator.vibrate && navigator.vibrate(p); } catch {} }
const feedback = {
  scan() { vibrate(40); tone(1200, 70, 0, 'sine', 0.15); },
  good() { vibrate(250); tone(880, 200); },
  bad()  { vibrate([200,100,200,100,200,100,200,100,200]); for (let i = 0; i < 5; i++) tone(220, 200, i * 0.3, 'square', 0.2); }
};
let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.screen !== 'start') keepAwake(); });

/* ---------- state ---------- */
const S = {
  screen: 'start',
  defaultMode: 'trigger',
  modeChosen: false,   // asked each time the page loads, then not again until it is reloaded
  pickedMode: null,
  mode: 'trigger',
  round: 1,
  photos: [],     // { blob, url } per round
  serials: [],    // accepted serial (normalized) per round
  s1: null, s2: null,
  retakeIdx: null   // failed round whose photo is being retaken on the result screen
};
function resetBox() {
  S.photos.forEach((p) => p && URL.revokeObjectURL(p.url));
  Object.assign(S, { round: 1, photos: [], serials: [], s1: null, s2: null, retakeIdx: null, mode: S.defaultMode });
  lastResults = null; lastOnly = null;
}

/* ---------- hardware scanner (keyboard mode) ---------- */
// The scan box lives in a fixed dock outside the screens. It is never removed between scan 1 and
// scan 2, so Android keeps the keyboard connection that many scanners use to type the barcode.
const wedgeEl = $('#wedge'), dock = $('#dock'), sigEl = $('#sig'), logEl = $('#scanlog');
let wedgeOn = false, wedgeCb = null, wedgeTimer = null;
let keyBuf = '', compBuf = '', pressBuf = '', txtBuf = '', sigCount = 0, evLog = [];
const IDLE_MS = 300;   // a scan with no Enter at the end counts after this much quiet
function signal() { sigCount++; sigEl.textContent = `Scanner signals received: ${sigCount}`; }
function logEv(t) { evLog.push(t); if (evLog.length > 16) evLog.shift(); logEl.textContent = evLog.join('\n'); }
const show = (v) => (v == null || v === '' ? '-' : JSON.stringify(String(v)).slice(0, 26));
function charFromKey(e) {
  if (e.key && e.key.length === 1) return e.key;
  const kc = e.keyCode;                       // scanners that send key codes but no key name
  if (kc >= 48 && kc <= 57) return String.fromCharCode(kc);
  if (kc >= 65 && kc <= 90) return String.fromCharCode(kc);
  if (kc >= 96 && kc <= 105) return String(kc - 96);
  return '';
}
// The scan is whichever source captured the most: the box's text, the typed keys, or composed text.
function current() {
  return [wedgeEl.value, keyBuf, compBuf, pressBuf, txtBuf].map((x) => String(x || '').trim()).sort((a, b) => b.length - a.length)[0];
}
function focusWedge() {
  if (wedgeOn && document.activeElement !== wedgeEl) { try { wedgeEl.focus({ preventScroll: true }); } catch {} }
}
function clearBuffers() { clearTimeout(wedgeTimer); keyBuf = ''; compBuf = ''; pressBuf = ''; txtBuf = ''; }
function commitScan(v) {
  v = String(v || '').trim();
  clearBuffers(); wedgeEl.value = '';
  if (v && wedgeOn && wedgeCb) wedgeCb(v);
}
function schedule() { clearTimeout(wedgeTimer); wedgeTimer = setTimeout(() => commitScan(current()), IDLE_MS); }
function armWedge(cb) {
  wedgeOn = true; wedgeCb = cb; clearBuffers(); wedgeEl.value = '';
  sigCount = 0; evLog = []; sigEl.textContent = 'Scanner signals received: 0'; logEl.textContent = 'Nothing received yet.';
  dock.hidden = false;
  focusWedge(); setTimeout(focusWedge, 200);
}
function disarmWedge(keepOpen) {       // keepOpen: the next screen is also a trigger scan, so keep focus
  wedgeOn = false; wedgeCb = null; clearBuffers();
  if (!keepOpen) { try { wedgeEl.blur(); } catch {} wedgeEl.value = ''; dock.hidden = true; }
}
wedgeEl.addEventListener('beforeinput', (e) => { if (wedgeOn) logEv(`beforeinput ${e.inputType} ${show(e.data)}`); });
wedgeEl.addEventListener('input', (e) => { if (!wedgeOn) return; signal(); logEv(`input ${e.inputType || ''} ${show(e.data)} value=${show(wedgeEl.value)}`); schedule(); });
wedgeEl.addEventListener('compositionupdate', (e) => { if (!wedgeOn) return; if (e.data) compBuf = e.data; logEv(`compose ${show(e.data)}`); schedule(); });
wedgeEl.addEventListener('compositionend', (e) => { if (!wedgeOn) return; if (e.data) compBuf = e.data; logEv(`composeend ${show(e.data)}`); schedule(); });
wedgeEl.addEventListener('textInput', (e) => { if (!wedgeOn) return; if (e.data) txtBuf += e.data; signal(); logEv(`textInput ${show(e.data)}`); schedule(); });
wedgeEl.addEventListener('paste', (e) => {
  if (!wedgeOn) return;
  const t = (e.clipboardData && e.clipboardData.getData('text')) || '';
  logEv(`paste ${show(t)}`); if (t) { e.preventDefault(); commitScan(t); }
});
wedgeEl.addEventListener('blur', () => { if (wedgeOn) setTimeout(focusWedge, 80); });
document.addEventListener('keypress', (e) => {
  if (!wedgeOn) return;
  signal();
  logEv(`press ${show(e.key)} cc=${e.charCode}`);
  const ch = e.key && e.key.length === 1 ? e.key : (e.charCode > 31 ? String.fromCharCode(e.charCode) : '');
  if (ch) { pressBuf += ch; schedule(); }
}, true);
document.addEventListener('keyup', (e) => { if (wedgeOn) logEv(`up ${show(e.key)} kc=${e.keyCode}`); }, true);
// Every key the scanner sends is seen here, whether or not the box has focus.
document.addEventListener('keydown', (e) => {
  if (!wedgeOn || e.ctrlKey || e.altKey || e.metaKey) return;
  signal();
  logEv(`key ${show(e.key)} code=${e.code || '-'} kc=${e.keyCode}`);
  if (e.key === 'Enter' || e.key === 'Tab' || e.keyCode === 13 || e.keyCode === 9) { e.preventDefault(); commitScan(current()); return; }
  const ch = charFromKey(e);
  if (ch) { keyBuf += ch; schedule(); }
}, true);

/* ---------- camera barcode scanner ---------- */
let camStream = null, camRun = 0;
async function ensureStream() {
  if (camStream && camStream.active) return camStream;
  camStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
  });
  return camStream;
}
function stopCamera() {
  camRun++;
  if (camStream) { camStream.getTracks().forEach((t) => t.stop()); camStream = null; }
}
let detectorPromise = null;
function getDetector() {
  if (detectorPromise) return detectorPromise;
  detectorPromise = (async () => {
    if ('BarcodeDetector' in window) {
      try {
        const sup = await BarcodeDetector.getSupportedFormats();
        const want = ['code_128','code_39','code_93','codabar','ean_13','ean_8','itf','upc_a','upc_e','qr_code','data_matrix','pdf417','aztec'].filter((f) => sup.includes(f));
        const d = new BarcodeDetector(want.length ? { formats: want } : undefined);
        return async (video) => (await d.detect(video)).map((b) => b.rawValue).filter(Boolean);
      } catch {}
    }
    // Backup reader for browsers without BarcodeDetector. Reads one barcode per frame.
    await loadScript('zxing.min.js');
    const hints = new Map(); hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    const reader = new ZXing.MultiFormatReader(); reader.setHints(hints);
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    return async (video) => {
      const w = video.videoWidth, hgt = video.videoHeight;
      if (!w) return [];
      canvas.width = w; canvas.height = hgt; ctx.drawImage(video, 0, 0, w, hgt);
      try {
        const src = new ZXing.HTMLCanvasElementLuminanceSource(canvas);
        return [reader.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src))).getText()];
      } catch { return []; }
    };
  })();
  detectorPromise.catch(() => { detectorPromise = null; });
  return detectorPromise;
}
/* Safeguards (deliberate): a barcode must read the same in two frames in a row,
   two barcodes in view are ignored, and after serial 1 the same barcode only counts
   again once the camera has looked away. */
async function startCamera(video, setStatus, onCode, blockNorm) {
  const run = ++camRun;
  try {
    const stream = await ensureStream();
    if (run !== camRun) return;
    video.srcObject = stream; video.setAttribute('playsinline', ''); video.muted = true;
    await video.play();
    setStatus('Starting scanner…');
    const detect = await getDetector();
    let last = null, lookedAway = !blockNorm;
    setStatus('Point the camera at the barcode');
    while (run === camRun) {
      if (!document.hidden && video.readyState >= 2) {
        let vals = [];
        try { vals = [...new Set((await detect(video)).map((v) => v.trim()))]; } catch {}
        if (run !== camRun) return;
        if (vals.length === 0) {
          last = null; lookedAway = true;
          setStatus('Point the camera at the barcode');
        } else if (vals.length > 1) {
          last = null; setStatus('Two barcodes in view. Show just one.', true);
        } else {
          const v = vals[0];
          if (!lookedAway && blockNorm && norm(v) === blockNorm) {
            last = null; setStatus('Move the camera away, then scan again.', true);
          } else if (v === last) {
            camRun++; onCode(v); return;
          } else { last = v; setStatus('Hold steady…'); }
        }
      }
      await sleep(110);
    }
  } catch (err) {
    if (run !== camRun) return;
    const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
    setStatus(denied
      ? 'Camera is blocked. Allow camera access for this site in Chrome, or use the scanner trigger.'
      : 'Camera could not start. Use the scanner trigger instead.', true);
  }
}

/* ---------- photos ---------- */
const photoInput = $('#photoInput');
async function prepPhoto(file) {
  try {
    let bmp;
    try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch {
      bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
    }
    const w = bmp.width || bmp.naturalWidth, hh = bmp.height || bmp.naturalHeight;
    const scale = Math.min(1, 2400 / Math.max(w, hh));
    const c = document.createElement('canvas');
    c.width = Math.round(w * scale); c.height = Math.round(hh * scale);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.92));
    return blob || file;
  } catch { return file; }
}
photoInput.addEventListener('change', async () => {
  const f = photoInput.files && photoInput.files[0];
  photoInput.value = '';
  if (!f) return;
  const blob = await prepPhoto(f);
  if (S.retakeIdx != null) {            // retaking a failed photo on the result screen
    const i = S.retakeIdx; S.retakeIdx = null;
    if (S.photos[i]) URL.revokeObjectURL(S.photos[i].url);
    S.photos[i] = { blob, url: URL.createObjectURL(blob) };
    runChecks([i]);
    return;
  }
  const old = S.photos[S.round - 1];
  if (old) URL.revokeObjectURL(old.url);
  S.photos[S.round - 1] = { blob, url: URL.createObjectURL(blob) };
  go('photo');
});

/* ---------- screens ---------- */
const main = $('#screen');
function renderHeader() {
  const inRound = ['photo', 'scan1', 'scan2', 'match', 'mismatch'].includes(S.screen);
  const finished = ['checking', 'good', 'bad', 'error'].includes(S.screen);
  const tr = $('#tracker'); tr.replaceChildren();
  for (let i = 0; i < ROUNDS; i++) {
    const done = i < S.serials.length;
    const now = inRound && !done && i === S.round - 1;
    tr.append(h('div', { class: 'seg' + (done ? ' done' : now ? ' now' : '') }));
  }
  $('#roundLabel').textContent = ONE ? '' : inRound ? `Round ${S.round} of ${ROUNDS}` : finished ? 'All rounds scanned' : '';
  tr.hidden = ONE; $('#roundLabel').hidden = ONE;
  const ta = $('#topAction'); ta.replaceChildren();
  if (S.screen !== 'start') ta.append(h('button', { class: 'link', onclick: startOver }, 'Start over'));
}
function startOver() {
  if (S.screen === 'good' || S.screen === 'bad' || confirm('Start over? Photos and scans for this box will be cleared.')) newBox();
}

let currentGo = 0;
function go(name) {
  currentGo++;
  S.screen = name;
  if (name !== 'bad') S.retakeIdx = null;
  disarmWedge((name === 'scan1' || name === 'scan2') && S.mode === 'trigger');
  if ((name !== 'scan1' && name !== 'scan2') || S.mode === 'trigger') stopCamera();
  document.body.classList.toggle('theme-ok', name === 'match' || name === 'good');
  document.body.classList.toggle('theme-bad', name === 'mismatch' || name === 'bad');
  renderHeader();
  main.replaceChildren();
  window.scrollTo(0, 0);
  ({ start: startScreen, photo: photoScreen, scan1: () => scanScreen(1), scan2: () => scanScreen(2),
     match: matchScreen, mismatch: mismatchScreen, checking: checkingScreen, good: goodScreen, bad: badScreen,
     error: errorScreen }[name])();
}

function newBox() { unlockAudio(); keepAwake(); resetBox(); go('photo'); }

function startScreen() {
  const chooseMode = (mode) => { S.defaultMode = mode; S.mode = mode; S.pickedMode = mode; S.modeChosen = true; go('start'); };
  if (!S.modeChosen) {   // first screen after the page loads (or after tapping Change)
    main.append(
      h('h1', { text: 'How will you scan?' }),
      h('p', { class: 'sub', text: 'Pick one to begin. It stays selected for every box until you close or reload the app.' }),
      h('div', { class: 'choices', role: 'group', 'aria-label': 'How will you scan?' },
        h('button', { class: 'choice', 'aria-pressed': String(S.pickedMode === 'trigger'), onclick: () => chooseMode('trigger') },
          h('b', { text: 'Handheld scanner' }), h('span', { text: 'Pull the trigger to scan' })),
        h('button', { class: 'choice', 'aria-pressed': String(S.pickedMode === 'camera'), onclick: () => chooseMode('camera') },
          h('b', { text: 'Phone camera' }), h('span', { text: 'Point the camera at the barcode' }))
      )
    );
    return;
  }
  main.append(
    h('h1', { text: 'Check a box' }),
    h('p', { class: 'sub', text: ONE ? 'Photograph the serial label and scan it twice. The app then reads the photo and confirms it matches.' : `Photograph each serial label and scan it twice. After ${ROUNDS} rounds the app reads the photos and confirms the box is right.` }),
    h('p', { class: 'sub' }, 'Scanner: ', h('b', { text: S.defaultMode === 'camera' ? 'Phone camera' : 'Handheld scanner' }), ' ',
      h('button', { class: 'link', onclick: () => { S.modeChosen = false; go('start'); } }, 'Change')),
    h('div', { class: 'actions' }, h('button', { class: 'btn', onclick: newBox }, 'Start box check'))
  );
}

function photoScreen() {
  const p = S.photos[S.round - 1];
  main.append(
    h('h2', { text: 'Photograph the serial label' }),
    h('p', { class: 'sub', text: 'Get close: the serial should fill about a third of the photo width. Hold steady and avoid glare.' })
  );
  if (p) main.append(h('img', { class: 'preview', src: p.url, alt: 'Photo of the serial label' }));
  const open = () => photoInput.click();
  main.append(h('div', { class: 'actions' },
    p ? h('button', { class: 'btn', onclick: () => { S.mode = S.defaultMode; S.s1 = S.s2 = null; go('scan1'); } }, 'Use this photo') : null,
    h('button', { class: p ? 'btn alt' : 'btn', onclick: open }, p ? 'Retake photo' : 'Open camera')
  ));
}

function scanScreen(which) {
  const token = currentGo;
  const trig = S.mode === 'trigger';
  main.append(h('h2', { text: `Scan serial ${which}` }));
  if (which === 2) main.append(h('div', { class: 'chip' }, h('div', { class: 'label', text: 'Serial 1' }), h('div', { class: 'serial', text: S.s1 })));
  let video = null, statusEl = null;
  if (trig) {
    main.append(h('div', { class: 'trigger-note', text: 'Pull the scanner trigger' }),
      h('p', { class: 'sub small', text: 'Keep the scanner box at the bottom of the screen selected. If nothing happens, tap it once.' }));
  } else {
    video = h('video', { autoplay: true, playsinline: true, muted: true });
    statusEl = h('div', { class: 'status', 'aria-live': 'polite' });
    main.append(h('div', { class: 'cam' }, video), statusEl);
  }
  main.append(h('div', { class: 'actions' },
    trig ? h('button', { class: 'btn', onclick: () => { const v = current(); if (v) commitScan(v); else sigEl.textContent = 'Nothing received yet. Pull the trigger first.'; } }, 'Use what the box shows') : null,
    h('button', { class: 'btn alt', onclick: () => { S.mode = trig ? 'camera' : 'trigger'; go(which === 1 ? 'scan1' : 'scan2'); } },
      trig ? 'Use camera instead' : 'Use scanner trigger instead')));

  const onCode = (raw) => {
    if (token !== currentGo) return;
    feedback.scan();
    if (which === 1) { S.s1 = raw.trim(); go('scan2'); }
    else {
      S.s2 = raw.trim();
      go(norm(S.s1) === norm(S.s2) ? 'match' : 'mismatch');
    }
  };
  if (trig) armWedge(onCode);
  else startCamera(video, (t, warn) => { statusEl.textContent = t; statusEl.classList.toggle('warn', !!warn); }, onCode, which === 2 ? norm(S.s1) : null);
}

function matchScreen() {
  S.serials[S.round - 1] = norm(S.s1);
  renderHeader();
  feedback.good();
  const last = S.round === ROUNDS;
  main.append(
    h('h2', { text: 'Serials match' }),
    h('div', { class: 'serial', text: norm(S.s1) }),
    h('div', { class: 'actions' },
      h('button', { class: 'btn light', onclick: () => { if (last) runChecks(); else { S.round++; S.s1 = S.s2 = null; S.mode = S.defaultMode; go('photo'); } } },
        last ? (ONE ? 'Check the photo' : 'Check the photos') : 'Next round'))
  );
}

function mismatchScreen() {
  feedback.bad();
  main.append(
    h('h2', { text: "Serials don't match" }),
    h('div', { class: 'pair' },
      h('div', {}, h('div', { class: 'label', text: 'Serial 1' }), h('div', { class: 'serial', text: S.s1 })),
      h('div', {}, h('div', { class: 'label', text: 'Serial 2' }), h('div', { class: 'serial', text: S.s2 }))),
    h('p', { class: 'sub', text: 'The photo is kept. Scan both serials again.' }),
    h('div', { class: 'actions' },
      h('button', { class: 'btn light', onclick: () => { S.s1 = S.s2 = null; go('scan1'); } }, 'Try again'))
  );
}

/* ---------- photo check (OCR) ---------- */
const TESS_FOUND = (text, serial) => !!serial && norm(text).includes(serial);
function candidates(texts) {
  const out = new Set();
  for (const t of texts) {
    const spaced = String(t).toUpperCase().split(/\s+/).map((w) => norm(w)).join(' ');
    (spaced.match(/\b[A-Z]{1,3}\d{5,}\b/g) || []).forEach((m) => out.add(m));
  }
  if (out.size) return [...out].slice(0, 4).join('   ');
  return 'no serial found';
}
/* HP-BEGIN: pure image helpers (also unit-tested outside the browser) */
function toGray(rgba, n) {
  const g = new Uint8ClampedArray(n);
  for (let i = 0, j = 0; i < n; i++, j += 4) g[i] = (rgba[j] * 299 + rgba[j + 1] * 587 + rgba[j + 2] * 114) / 1000;
  return g;
}
function boxBlurH(src, dst, w, h, r) {
  const div = 2 * r + 1;
  for (let y = 0; y < h; y++) {
    const o = y * w; let sum = 0;
    for (let k = -r; k <= r; k++) sum += src[o + Math.min(w - 1, Math.max(0, k))];
    for (let x = 0; x < w; x++) {
      dst[o + x] = sum / div;
      sum += src[o + Math.min(w - 1, x + r + 1)] - src[o + Math.max(0, x - r)];
    }
  }
}
function boxBlurV(src, dst, w, h, r) {
  const div = 2 * r + 1;
  for (let x = 0; x < w; x++) {
    let sum = 0;
    for (let k = -r; k <= r; k++) sum += src[Math.min(h - 1, Math.max(0, k)) * w + x];
    for (let y = 0; y < h; y++) {
      dst[y * w + x] = sum / div;
      sum += src[Math.min(h - 1, y + r + 1) * w + x] - src[Math.max(0, y - r) * w + x];
    }
  }
}
// Removes the uneven background so small, low-contrast stamped or printed text stands out.
function highPass(gray, w, h) {
  const n = w * h;
  let a = Float32Array.from(gray), b = new Float32Array(n);
  const r = Math.max(2, Math.round(Math.max(w, h) * 0.012));
  for (let i = 0; i < 3; i++) { boxBlurH(a, b, w, h, r); boxBlurV(b, a, w, h, r); }
  const d = new Float32Array(n), hist = new Uint32Array(512);
  for (let i = 0; i < n; i++) {
    const v = gray[i] - a[i]; d[i] = v;
    hist[Math.min(511, Math.max(0, Math.round(v) + 256))]++;
  }
  let acc = 0, lo = -255, hi = 255;
  for (let k = 0; k < 512; k++) { acc += hist[k]; if (acc >= n * 0.01) { lo = k - 256; break; } }
  acc = 0;
  for (let k = 511; k >= 0; k--) { acc += hist[k]; if (acc >= n * 0.01) { hi = k - 256; break; } }
  const span = Math.max(1, hi - lo), out = new Uint8ClampedArray(n);
  for (let i = 0; i < n; i++) out[i] = ((d[i] - lo) / span) * 255;
  return out;
}
// Four overlapping zoomed-in pieces of the photo.
function tileRects(W, H) {
  const tw = Math.round(W * 0.65), th = Math.round(H * 0.55), out = [];
  for (const y of [0, H - th]) for (const x of [0, W - tw]) out.push({ x, y, w: tw, h: th });
  return out;
}
// Finds label- or plate-shaped regions that are lighter (or darker) than their surroundings,
// e.g. a small stamped plate on a dark part. Returns rectangles in full-photo pixels, best first.
function findPlates(gray, w, h) {
  const W = w >> 1, H = h >> 1, g = new Float32Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = 2 * y * w + 2 * x;
    g[y * W + x] = (gray[i] + gray[i + 1] + gray[i + w] + gray[i + w + 1]) / 4;
  }
  let a = Float32Array.from(g), b = new Float32Array(W * H);
  const r = Math.max(4, Math.round(Math.max(W, H) * 0.05));
  for (let i = 0; i < 3; i++) { boxBlurH(a, b, W, H, r); boxBlurV(b, a, W, H, r); }
  const lab = new Int32Array(W * H), stack = new Int32Array(W * H), found = [];
  for (const pol of [1, -1]) for (const T of [20, 35]) {
    lab.fill(0);
    const mask = new Uint8Array(W * H);
    for (let i = 0; i < W * H; i++) { const d = g[i] - a[i]; mask[i] = pol > 0 ? d > T : d < -T; }
    let id = 0;
    for (let s0 = 0; s0 < W * H; s0++) {
      if (!mask[s0] || lab[s0]) continue;
      id++; let sp = 0; stack[sp++] = s0; lab[s0] = id;
      let x0 = W, y0 = H, x1 = 0, y1 = 0, area = 0;
      while (sp) {
        const q = stack[--sp], x = q % W, y = (q / W) | 0;
        area++; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
        if (x > 0 && mask[q - 1] && !lab[q - 1]) { lab[q - 1] = id; stack[sp++] = q - 1; }
        if (x < W - 1 && mask[q + 1] && !lab[q + 1]) { lab[q + 1] = id; stack[sp++] = q + 1; }
        if (y > 0 && mask[q - W] && !lab[q - W]) { lab[q - W] = id; stack[sp++] = q - W; }
        if (y < H - 1 && mask[q + W] && !lab[q + W]) { lab[q + W] = id; stack[sp++] = q + W; }
      }
      const cw = x1 - x0 + 1, ch = y1 - y0 + 1, fill = area / (cw * ch), asp = cw / ch;
      if (cw >= 0.04 * W && cw <= 0.6 * W && ch >= 0.012 * H && ch <= 0.15 * H && asp >= 1.5 && asp <= 14 && fill >= 0.4)
        found.push({ x: x0 * 2, y: y0 * 2, w: cw * 2, h: ch * 2, fill, invert: pol < 0 });
    }
  }
  found.sort((p, q) => q.fill - p.fill);
  const iou = (p, q) => {
    const ix = Math.max(0, Math.min(p.x + p.w, q.x + q.w) - Math.max(p.x, q.x));
    const iy = Math.max(0, Math.min(p.y + p.h, q.y + q.h) - Math.max(p.y, q.y));
    return (ix * iy) / (p.w * p.h + q.w * q.h - ix * iy);
  };
  const out = [];
  for (const c of found) if (!out.some((o) => iou(o, c) > 0.5)) out.push(c);
  return out.slice(0, 6);
}
function insetRect(r) {   // trim the plate's dark edge so only the plate face is read
  const m = Math.max(2, Math.round(r.h * 0.045));
  return { x: r.x + m, y: r.y + m, w: Math.max(8, r.w - 2 * m), h: Math.max(8, r.h - 2 * m) };
}
function cropGray(gray, W, r, invert) {
  const o = new Uint8ClampedArray(r.w * r.h);
  for (let y = 0; y < r.h; y++) for (let x = 0; x < r.w; x++) {
    const v = gray[(r.y + y) * W + r.x + x];
    o[y * r.w + x] = invert ? 255 - v : v;
  }
  return o;
}
/* HP-END */

function canvasFromGray(gray, w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'), img = ctx.createImageData(w, h), d = img.data;
  for (let i = 0, j = 0; i < gray.length; i++, j += 4) { d[j] = d[j + 1] = d[j + 2] = gray[i]; d[j + 3] = 255; }
  ctx.putImageData(img, 0, 0);
  return c;
}
function cropCanvas(src, r) {
  const c = document.createElement('canvas'); c.width = r.w; c.height = r.h;
  c.getContext('2d').drawImage(src, r.x, r.y, r.w, r.h, 0, 0, r.w, r.h);
  return c;
}
/* Reads one photo. Small stamped serials on dark, textured parts defeat a single pass over the
   whole photo, so: (1) find the label/plate and read it up close, (2) background removed,
   (3) photo as taken, (4) zoomed pieces. Stops as soon as the scanned serial is found. */
async function readPhoto(worker, blob, serial, status) {
  const texts = [];
  const attempt = async (img, psm) => {
    await worker.setParameters({ tessedit_pageseg_mode: psm });
    const t = (await worker.recognize(img)).data.text || '';
    texts.push(t);
    return TESS_FOUND(t, serial);
  };
  const bmp = await createImageBitmap(blob);
  const full = document.createElement('canvas');
  full.width = bmp.width; full.height = bmp.height;
  const ctx = full.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(bmp, 0, 0);
  if (bmp.close) bmp.close();
  const W = full.width, H = full.height;
  const gray = toGray(ctx.getImageData(0, 0, W, H).data, W * H);
  // 1) find label/plate-shaped regions and read each one up close
  status(' (finding the label)');
  const plates = findPlates(gray, W, H);
  for (const pass of [0, 1]) for (const p of plates) {
    const r = pass === 0 ? insetRect(p) : p;
    if (await attempt(canvasFromGray(cropGray(gray, W, r, p.invert), r.w, r.h), pass === 0 ? '6' : '7')) return { ok: true, texts };
  }
  // 2) whole photo with the background evened out
  status('');
  const hp = canvasFromGray(highPass(gray, W, H), W, H);
  if (await attempt(hp, '11')) return { ok: true, texts };
  status(' (second look)');
  if (await attempt(blob, '3')) return { ok: true, texts };
  status(' (zooming in)');
  for (const r of tileRects(W, H)) if (await attempt(cropCanvas(hp, r), '6')) return { ok: true, texts };
  return { ok: false, texts };
}

let barEl = null, labelEl = null;
function checkingScreen() {
  barEl = h('i'); labelEl = h('p', { class: 'sub', text: 'Loading the photo reader…', 'aria-live': 'polite' });
  main.append(h('h2', { text: ONE ? 'Checking photo' : 'Checking photos' }), labelEl, h('div', { class: 'bar' }, barEl),
    h('p', { class: 'sub', text: ONE ? 'Keep this screen open. This takes a few seconds.' : 'Keep this screen open. This takes a few seconds per photo.' }));
}
function setProgress(frac, text) { if (barEl) barEl.style.width = Math.round(frac * 100) + '%'; if (text && labelEl) labelEl.textContent = text; }

let lastResults = null, lastOnly = null;
async function runChecks(only) {
  lastOnly = only || null;
  const list = only || Array.from({ length: ROUNDS }, (_, i) => i);
  const prior = Array.isArray(lastResults) ? lastResults.slice() : [];
  go('checking');
  const token = currentGo;
  let worker = null;
  try {
    await loadScript('tesseract.min.js');
    let k = 0;
    worker = await Tesseract.createWorker('eng', 1, {
      workerPath: abs('worker.min.js'),
      corePath: abs('./'),
      langPath: abs('./'),
      workerBlobURL: false, gzip: true, cacheMethod: 'none',
      logger: (m) => { if (m.status === 'recognizing text') setProgress((k + m.progress) / list.length); }
    });
    const results = prior;
    for (k = 0; k < list.length; k++) {
      if (token !== currentGo) { await worker.terminate(); return; }
      const idx = list[k];
      setProgress(k / list.length, ONE ? 'Reading the photo' : `Reading photo ${idx + 1} of ${ROUNDS}`);
      results[idx] = await readPhoto(worker, S.photos[idx].blob, S.serials[idx],
        (t) => setProgress(k / list.length, (ONE ? 'Reading the photo' : `Reading photo ${idx + 1} of ${ROUNDS}`) + t));
    }
    await worker.terminate(); worker = null;
    lastResults = results;
    setProgress(1);
    go(results.every((r) => r && r.ok) ? 'good' : 'bad');
  } catch (err) {
    try { worker && await worker.terminate(); } catch {}
    lastResults = { message: String((err && err.message) || err) };
    go('error');
  }
}

function goodScreen() {
  feedback.good();
  main.append(
    h('h2', { text: 'Box is good' }),
    h('p', { class: 'sub', text: ONE ? 'The photo shows the serial that was scanned.' : `All ${ROUNDS} photos contain the serial that was scanned.` }),
    h('ul', { class: 'rounds' }, S.serials.map((s, i) => h('li', {}, ONE ? null : h('span', { text: `Round ${i + 1}` }), h('span', { class: 'serial', text: s })))),
    h('div', { class: 'actions' }, h('button', { class: 'btn light', onclick: newBox }, 'Check another box'))
  );
}

function badScreen() {
  feedback.bad();
  const failed = lastResults.map((r, i) => ({ r, i })).filter((x) => x.r && !x.r.ok);
  main.append(
    h('h2', { text: 'Box is bad' }),
    h('p', { class: 'sub', text: (ONE ? 'The photo does not show the scanned serial.' : failed.length === 1 ? 'One photo does not show the scanned serial.' : `${failed.length} photos do not show the scanned serial.`) + ' If the serial is really in the photo, retake it closer and check again.' }),
    ...failed.map(({ r, i }) => h('div', { class: 'fail' },
      ONE ? null : h('h3', { text: `Round ${i + 1}` }),
      h('div', { class: 'label', text: 'Scanned' }), h('div', { class: 'serial', text: S.serials[i] }),
      h('div', { class: 'label', text: 'Photo reads' }), h('div', { class: 'serial', text: candidates(r.texts) }),
      h('img', { src: S.photos[i].url, alt: ONE ? 'Photo of the serial' : `Photo for round ${i + 1}` }),
      h('button', { class: 'btn light retake', onclick: () => { S.retakeIdx = i; photoInput.click(); } }, 'Retake photo')
    )),
    h('div', { class: 'actions' }, h('button', { class: 'btn light', onclick: newBox }, 'Check another box'))
  );
}

function errorScreen() {
  main.append(
    h('h2', { text: ONE ? "Couldn't read the photo" : "Couldn't read the photos" }),
    h('div', { class: 'err', text: lastResults && lastResults.message ? lastResults.message : 'Something went wrong while reading the photo.' }),
    h('p', { class: 'sub', text: ONE ? 'Your scans and photo are still here. Try again.' : 'Your scans and photos are still here. Try again.' }),
    h('div', { class: 'actions' }, h('button', { class: 'btn', onclick: () => runChecks(lastOnly) }, 'Try again'))
  );
}

/* ---------- boot ---------- */
S.mode = S.defaultMode;
go('start');
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
</body>
</html>
